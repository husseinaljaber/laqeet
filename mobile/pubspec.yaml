name: laqeet
description: "لقيت: شغل بسوريا وتركيا على قد شهادتك"
publish_to: 'none'

# versionName+versionCode for the stores; bump both for every release.
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8
  provider: 6.1.5+1            # app state (ChangeNotifier)
  go_router: 18.1.4            # screens and redirects (login → verify → profile → home)
  http: 1.6.0                  # talks to the Laqeet API
  flutter_secure_storage: 11.2.0  # login tokens (Keychain / Keystore)
  shared_preferences: 2.5.6    # small settings (theme)
  url_launcher: 6.3.3          # WhatsApp, call, email, apply links
  intl: 0.20.3                 # Arabic dates
  share_plus: 13.3.1           # share a job

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Plex
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-400.ttf
        - asset: assets/fonts/IBMPlexSansArabic-600.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-700.ttf
          weight: 700
    - family: Alexandria
      fonts:
        - asset: assets/fonts/Alexandria-700.ttf
          weight: 700
        - asset: assets/fonts/Alexandria-800.ttf
          weight: 800
