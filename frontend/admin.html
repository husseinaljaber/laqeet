<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>الإدارة · لقيت</title><meta name="robots" content="noindex"><link rel="icon" href="icons/icon.svg">
<link rel="stylesheet" href="app.css"><link rel="stylesheet" href="page.css">
<style>
.adm-tabs{display:flex;gap:8px;flex-wrap:wrap}
.hl-sum{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.hl-pill{border-radius:999px;padding:3px 12px;font-size:.85rem;font-weight:600}
.hl-fail{background:#FDECEA;color:#B42318}.hl-stale{background:#FEF3E2;color:#A15C07}.hl-ok{background:#E3F4EA;color:#18794E}
:root[data-theme="dark"] .hl-fail{background:#3A1715;color:#F97066}
:root[data-theme="dark"] .hl-stale{background:#3A2A10;color:#F5B556}
:root[data-theme="dark"] .hl-ok{background:#13311F;color:#5BD49A}
.tbl-wrap{overflow-x:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:10px;margin:8px 0 14px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi b{display:block;font-size:1.5rem;font-variant-numeric:tabular-nums}
.kpi span{font-size:.82rem;color:var(--muted)}
.dbar{display:grid;grid-template-columns:5.5rem 1fr 3rem;gap:8px;align-items:center;font-size:.85rem;font-variant-numeric:tabular-nums}
.dbar .t{height:8px;border-radius:6px;background:var(--line);overflow:hidden}
.dbar .t i{display:block;height:100%;background:var(--accent)}
.tbl td small{color:var(--muted)}
</style></head>
<body>
<main class="inner page">
  <div class="box">
    <h2>الإدارة</h2>
    <label>رمز الإدارة <input id="tok" type="password" autocomplete="off"></label>
    <div class="adm-tabs">
      <button class="btn primary" id="loadQueue">طابور المراجعة</button>
      <button class="btn ghost" id="loadHealth">صحة المصادر</button>
      <button class="btn ghost" id="loadStats">الإحصائيات</button>
      <button class="btn ghost" id="loadPartners">الشركاء</button>
      <button class="btn ghost" id="getBackup">نسخة احتياطية</button>
    </div>
    <div id="out"></div>
  </div>
</main>
<script>
const tok = document.getElementById('tok'), out = document.getElementById('out');
try { tok.value = sessionStorage.getItem('laqeet.admin') || ''; } catch (e) {}
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const H = () => ({'X-Admin-Token': tok.value});
function remember() { try { sessionStorage.setItem('laqeet.admin', tok.value); } catch (e) {} }

async function loadQueue() {
  remember();
  const r = await fetch('/api/admin/queue', {headers: H()});
  if (!r.ok) { out.textContent = 'الرمز غلط أو الإدارة مو مفعّلة (ADMIN_TOKEN).'; return; }
  const {jobs} = await r.json();
  out.innerHTML = jobs.length ? `<div class="tbl-wrap"><table class="tbl"><tr><th>الإعلان</th><th>ليش هون</th><th></th></tr>${jobs.map(j => `<tr id="r${j.id}">
    <td><b>${esc(j.title)}</b><br>${esc(j.employer)} · ${esc((j.cities||[]).join('، '))} · ${esc(j.phones?.join(' '))}<br><small>${esc(String(j.raw || '').slice(0, 400))}</small><br>${j.sources.map(s => `<a href="${esc(s.post_url)}" target="_blank" rel="noopener">${esc(s.label)}</a>`).join(' · ')}</td>
    <td>${j.source === 'employer' ? 'صاحب عمل' : j.reports ? j.reports + ' بلاغات' : 'ثقة قليلة'}</td>
    <td><button class="chip" data-a="approve" data-id="${j.id}">انشر</button> <button class="chip" data-a="reject" data-id="${j.id}">ارفض</button></td></tr>`).join('')}</table></div>` : 'ما في شي للمراجعة 👌';
}

const STATUS = {fail: ['hl-fail', 'أخطاء'], stale: ['hl-stale', 'ساكت'], ok: ['hl-ok', 'تمام']};
const KIND = {telegram: 'تلغرام', web_portals: 'موقع', ingo_ats: 'منظمة (ATS)', reliefweb: 'ReliefWeb', turkey_portals: 'موقع تركي', group: 'مجموعة'};
function ago(iso) {
  if (!iso) return 'أبداً';
  const h = (Date.now() - new Date(iso).getTime()) / 36e5;
  return h < 1 ? 'هلأ' : h < 48 ? `قبل ${Math.round(h)} ساعة` : `قبل ${Math.round(h / 24)} يوم`;
}
async function loadHealth() {
  remember();
  const r = await fetch('/api/admin/health', {headers: H()});
  if (!r.ok) { out.textContent = 'الرمز غلط أو الإدارة مو مفعّلة (ADMIN_TOKEN).'; return; }
  const d = await r.json();
  if (!d.sources.length) { out.textContent = 'لسا ما في تسجيل. بيبلّش بعد أول جمع.'; return; }
  const s = d.summary;
  out.innerHTML = `<div class="hl-sum">
      <span class="hl-pill hl-fail">أخطاء: ${s.fail || 0}</span>
      <span class="hl-pill hl-stale">ساكت: ${s.stale || 0}</span>
      <span class="hl-pill hl-ok">تمام: ${s.ok || 0}</span>
    </div>
    <p class="note">«ساكت» يعني ما جاب شي: قناة تلغرام من 7 أيام، أو موقع من يومين. غالباً الموقع غيّر شكله أو حجبنا.</p>
    <div class="tbl-wrap"><table class="tbl"><tr><th>المصدر</th><th>الحالة</th><th>آخر مرة جاب شي</th><th>آخر تشغيل</th><th>الخطأ</th></tr>
    ${d.sources.map(x => `<tr><td><b>${esc(x.label)}</b><br><small>${esc(KIND[x.kind] || x.kind)} · ${esc(x.source)}</small></td>
      <td><span class="hl-pill ${STATUS[x.status][0]}">${STATUS[x.status][1]}</span></td>
      <td>${esc(ago(x.last_items_at))}</td>
      <td>${esc(ago(x.last_run))} · ${x.last_count}</td>
      <td><small>${esc(x.last_error || '')}</small></td></tr>`).join('')}</table></div>`;
}
const PAGE_AR = {landing: 'الرئيسية', board: 'الوظائف', job: 'صفحة وظيفة', cv: 'السيرة', pulse: 'نبض السوق', scam: 'رادار النصب', employer: 'انشر وظيفة'};
const APPLY_AR = {whatsapp: 'واتساب', call: 'اتصال', site: 'موقع', form: 'فورم', email: 'إيميل', portal: 'بوابة بحساب'};
const sum = (o) => Object.values(o || {}).reduce((a, b) => a + b, 0);
function rows(obj, labels) {
  const list = Object.entries(obj || {}).sort((a, b) => b[1] - a[1]);
  if (!list.length) return '<p class="note">لسا ما في أرقام.</p>';
  const max = list[0][1] || 1;
  return list.map(([k, n]) => `<div class="dbar"><span>${esc((labels && labels[k]) || k || '—')}</span><span class="t"><i style="width:${n / max * 100}%"></i></span><span>${n}</span></div>`).join('');
}
async function loadStats() {
  remember();
  const r = await fetch('/api/admin/stats?days=30', {headers: H()});
  if (!r.ok) { out.textContent = 'الرمز غلط أو الإدارة مو مفعّلة (ADMIN_TOKEN).'; return; }
  const d = await r.json(), t = d.totals;
  const dayMax = Math.max(1, ...d.daily.map((x) => x.view));
  out.innerHTML = `<p class="note">آخر ${d.days} يوم. أرقام مجمّعة بس: ما منحفظ هوية ولا IP ولا cookie لحدا.</p>
    <div class="kpis">
      <div class="kpi"><b>${sum(t.view)}</b><span>زيارة صفحة</span></div>
      <div class="kpi"><b>${sum(t.apply)}</b><span>ضغطة «قدّم»</span></div>
      <div class="kpi"><b>${sum(t.onboard)}</b><span>كمّلوا «شو شهادتك؟»</span></div>
      <div class="kpi"><b>${sum(t.source)}</b><span>زيارة بعتناها للمصادر</span></div>
      <div class="kpi"><b>${sum(t.search)}</b><span>بحث</span></div>
      <div class="kpi"><b>${sum(t.share)}</b><span>مشاركة</span></div>
      <div class="kpi"><b>${(t.install || {}).accepted || 0}</b><span>ثبّتوا التطبيق</span></div>
    </div>
    <h3>كل يوم (زيارات · ضغطات قدّم)</h3>
    ${d.daily.length ? d.daily.map((x) => `<div class="dbar"><span>${esc(x.day.slice(5))}</span><span class="t"><i style="width:${x.view / dayMax * 100}%"></i></span><span>${x.view} · ${x.apply}</span></div>`).join('') : '<p class="note">لسا ما في أرقام.</p>'}
    <h3>طريقة التقديم</h3>${rows(t.apply, APPLY_AR)}
    <h3>ضغطات «قدّم» حسب المصدر</h3>${rows(t.apply_src, d.source_labels)}
    <h3>زيارات بعتناها لكل مصدر</h3>${rows(t.source, d.source_labels)}
    <h3>الصفحات</h3>${rows(t.view, PAGE_AR)}
    <h3>الشهادات (من «شو شهادتك؟»)</h3>${rows(t.onboard)}`;
}
document.getElementById('loadStats').addEventListener('click', loadStats);

// Partners: what we sent each channel, and a message ready to copy for its admin.
function partnerMsg(p, d) {
  const site = d.public_url && !/localhost|127\.0\.0\.1|example/.test(d.public_url) ? d.public_url : '';
  return `السلام عليكم،
أنا من منصة «${d.site_name}»، منصة مجانية بتجمع إعلانات الشغل بسوريا وتركيا لتسهّل على الناس يلاقوا شغل.

منعرض إعلانات «${p.label}» مع ذكر اسم قناتكم ورابط الإعلان الأصلي دايماً، والتقديم بيصير من عندكم.
خلال آخر ${d.days} يوم:
• عرضنا ${p.recent} إعلان من عندكم (${p.open} منهم مفتوحين هلأ)
• بعتنالكم ${p.visits_sent} زيارة لقناتكم
• ${p.apply_clicks} شخص ضغط «قدّم» على إعلاناتكم
${site ? '\nالموقع: ' + site + '\n' : ''}
إذا بتحبّوا، فينا:
1) نحط اسمكم كـ«شريك» على صفحة المصادر.
2) نستقبل إعلاناتكم مرتبة مباشرة لتوصل أسرع وأدق.
وإذا ما بدكم نعرض إعلاناتكم، قولولنا ومنوقف فوراً.

شكراً إلكم على شغلكم 🙏`;
}
async function loadPartners() {
  remember();
  const r = await fetch('/api/admin/partners?days=30', {headers: H()});
  if (!r.ok) { out.textContent = 'الرمز غلط أو الإدارة مو مفعّلة (ADMIN_TOKEN).'; return; }
  const d = await r.json();
  window._partners = d;
  out.innerHTML = `<p class="note">آخر ${d.days} يوم. انسخ الرسالة وابعتها لأدمن القناة، ورقامها جاهزة جواتها.</p>
    <div class="tbl-wrap"><table class="tbl"><tr><th>المصدر</th><th>إعلانات (30 يوم)</th><th>مفتوحة</th><th>زيارات بعتناها</th><th>ضغطات قدّم</th><th></th></tr>
    ${d.sources.map((p, i) => `<tr><td><b>${esc(p.label)}</b><br><small>${p.url ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.url.replace(/^https:\/\//, ''))}</a>` : esc(p.source)}</small></td>
      <td>${p.recent}</td><td>${p.open}</td><td>${p.visits_sent}</td><td>${p.apply_clicks}</td>
      <td>${p.kind === 'telegram' ? `<button class="chip" data-copy-partner="${i}">انسخ الرسالة</button>` : ''}</td></tr>`).join('')}</table></div>`;
}
document.getElementById('loadPartners').addEventListener('click', loadPartners);
document.getElementById('getBackup').addEventListener('click', async () => {
  remember();
  const r = await fetch('/api/admin/backup', {headers: H()});
  if (!r.ok) { out.textContent = 'الرمز غلط أو الإدارة مو مفعّلة (ADMIN_TOKEN).'; return; }
  const blob = await r.blob(), a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `laqeet-backup-${new Date().toISOString().slice(0, 10)}.json.gz`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  out.innerHTML = '<p class="note">نزلت النسخة. خليها عندك وما ترفعها على GitHub، لأنه فيها أرقام أصحاب العمل. للاسترجاع: <code>python -m app.backup import الملف</code></p>';
});
out.addEventListener('click', (e) => {
  const b = e.target.closest('[data-copy-partner]'); if (!b) return;
  const d = window._partners, text = partnerMsg(d.sources[+b.dataset.copyPartner], d);
  navigator.clipboard.writeText(text).then(() => { b.textContent = 'انسخت ✓'; }).catch(() => { window.prompt('انسخ الرسالة:', text); });
});
out.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  const r = await fetch('/api/admin/jobs/' + b.dataset.id, {method: 'POST', headers: {...H(), 'Content-Type': 'application/json'}, body: JSON.stringify({action: b.dataset.a})});
  if (r.ok) document.getElementById('r' + b.dataset.id).remove();
});
document.getElementById('loadQueue').addEventListener('click', loadQueue);
document.getElementById('loadHealth').addEventListener('click', loadHealth);
</script>
</body></html>
