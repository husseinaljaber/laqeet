name: Mobile app

# Checks the Flutter app on every change to mobile/, and builds an Android APK you can download from the run's
# «Artifacts». Set the repository variable API_BASE (Settings → Secrets and variables → Actions → Variables) to the
# live server address, e.g. https://laqeet.example; without it the APK points at the Android emulator's host.
# Set APP_LINK_HOST to the bare domain (laqeet.example) so shared job links open the app.
on:
  push:
    branches: ["**"]
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  pull_request:
    paths: ["mobile/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build APK
        env:
          APP_LINK_HOST: ${{ vars.APP_LINK_HOST }}  # the site's domain, so shared /j/ links open the app
        run: flutter build apk --release --dart-define=API_BASE=${{ vars.API_BASE }} --dart-define=APP_VERSION=1.0.0
      - name: Build web (served by the site at /app)
        run: flutter build web --release --base-href /app/ --no-web-resources-cdn
      - uses: actions/upload-artifact@v4
        with:
          name: laqeet-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
