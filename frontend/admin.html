<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>الإدارة · لقيت</title><meta name="robots" content="noindex"><link rel="icon" href="icons/icon.svg">
<link rel="stylesheet" href="app.css"><link rel="stylesheet" href="page.css">
<style>
.adm-tabs{display:flex;gap:8px;flex-wrap:wrap}
.hl-sum{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.hl-pill{border-radius:999px;padding:3px 12px;font-size:.85rem;font-weight:600}
.hl-fail{background:#FDECEA;color:#B42318}.hl-stale{background:#FEF3E2;color:#A15C07}.hl-ok{background:#E3F4EA;color:#18794E}
:root[data-theme="dark"] .hl-fail{background:#3A1715;color:#F97066}
:root[data-theme="dark"] .hl-stale{background:#3A2A10;color:#F5B556}
:root[data-theme="dark"] .hl-ok{background:#13311F;color:#5BD49A}
.tbl-wrap{overflow-x:auto}
.tbl td small{color:var(--muted)}
</style></head>
<body>
<main class="inner page">
  <div class="box">
    <h2>الإدارة</h2>
    <label>رمز الإدارة <input id="tok" type="password" autocomplete="off"></label>
    <div class="adm-tabs">
      <button class="btn primary" id="loadQueue">طابور المراجعة</button>
      <button class="btn ghost" id="loadHealth">صحة المصادر</button>
    </div>
    <div id="out"></div>
  </div>
</main>
<script>
const tok = document.getElementById('tok'), out = document.getElementById('out');
try { tok.value = sessionStorage.getItem('laqeet.admin') || ''; } catch (e) {}
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const H = () => ({'X-Admin-Token': tok.value});
function remember() { try { sessionStorage.setItem('laqeet.admin', tok.value); } catch (e) {} }

async function loadQueue() {
  remember();
  const r = await fetch('/api/admin/queue', {headers: H()});
  if (!r.ok) { out.textContent = 'الرمز غلط أو الإدارة مو مفعّلة (ADMIN_TOKEN).'; return; }
  const {jobs} = await r.json();
  out.innerHTML = jobs.length ? `<div class="tbl-wrap"><table class="tbl"><tr><th>الإعلان</th><th>ليش هون</th><th></th></tr>${jobs.map(j => `<tr id="r${j.id}">
    <td><b>${esc(j.title)}</b><br>${esc(j.employer)} · ${esc((j.cities||[]).join('، '))} · ${esc(j.phones?.join(' '))}<br><small>${esc(String(j.raw || '').slice(0, 400))}</small><br>${j.sources.map(s => `<a href="${esc(s.post_url)}" target="_blank" rel="noopener">${esc(s.label)}</a>`).join(' · ')}</td>
    <td>${j.source === 'employer' ? 'صاحب عمل' : j.reports ? j.reports + ' بلاغات' : 'ثقة قليلة'}</td>
    <td><button class="chip" data-a="approve" data-id="${j.id}">انشر</button> <button class="chip" data-a="reject" data-id="${j.id}">ارفض</button></td></tr>`).join('')}</table></div>` : 'ما في شي للمراجعة 👌';
}

const STATUS = {fail: ['hl-fail', 'أخطاء'], stale: ['hl-stale', 'ساكت'], ok: ['hl-ok', 'تمام']};
const KIND = {telegram: 'تلغرام', web_portals: 'موقع', ingo_ats: 'منظمة (ATS)', reliefweb: 'ReliefWeb', turkey_portals: 'موقع تركي', group: 'مجموعة'};
function ago(iso) {
  if (!iso) return 'أبداً';
  const h = (Date.now() - new Date(iso).getTime()) / 36e5;
  return h < 1 ? 'هلأ' : h < 48 ? `قبل ${Math.round(h)} ساعة` : `قبل ${Math.round(h / 24)} يوم`;
}
async function loadHealth() {
  remember();
  const r = await fetch('/api/admin/health', {headers: H()});
  if (!r.ok) { out.textContent = 'الرمز غلط أو الإدارة مو مفعّلة (ADMIN_TOKEN).'; return; }
  const d = await r.json();
  if (!d.sources.length) { out.textContent = 'لسا ما في تسجيل. بيبلّش بعد أول جمع.'; return; }
  const s = d.summary;
  out.innerHTML = `<div class="hl-sum">
      <span class="hl-pill hl-fail">أخطاء: ${s.fail || 0}</span>
      <span class="hl-pill hl-stale">ساكت: ${s.stale || 0}</span>
      <span class="hl-pill hl-ok">تمام: ${s.ok || 0}</span>
    </div>
    <p class="note">«ساكت» يعني ما جاب شي: قناة تلغرام من 7 أيام، أو موقع من يومين. غالباً الموقع غيّر شكله أو حجبنا.</p>
    <div class="tbl-wrap"><table class="tbl"><tr><th>المصدر</th><th>الحالة</th><th>آخر مرة جاب شي</th><th>آخر تشغيل</th><th>الخطأ</th></tr>
    ${d.sources.map(x => `<tr><td><b>${esc(x.label)}</b><br><small>${esc(KIND[x.kind] || x.kind)} · ${esc(x.source)}</small></td>
      <td><span class="hl-pill ${STATUS[x.status][0]}">${STATUS[x.status][1]}</span></td>
      <td>${esc(ago(x.last_items_at))}</td>
      <td>${esc(ago(x.last_run))} · ${x.last_count}</td>
      <td><small>${esc(x.last_error || '')}</small></td></tr>`).join('')}</table></div>`;
}
out.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  const r = await fetch('/api/admin/jobs/' + b.dataset.id, {method: 'POST', headers: {...H(), 'Content-Type': 'application/json'}, body: JSON.stringify({action: b.dataset.a})});
  if (r.ok) document.getElementById('r' + b.dataset.id).remove();
});
document.getElementById('loadQueue').addEventListener('click', loadQueue);
document.getElementById('loadHealth').addEventListener('click', loadHealth);
</script>
</body></html>
